{% extends 'restaurant/base.html' %}

{% block title %}Edit Food | Foodora{% endblock %}

{% block extra_css %}
<style>
    body {
        background: #f8f5ef;
    }

    .food-form {
        max-width: 550px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
    }

    .food-form input:not([type="checkbox"]),
    .food-form textarea,
    .food-form select {
        width: 100%;
        padding: 9px;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-top: 5px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="food-form shadow-sm">
        <h3>Edit Food Item</h3>
        <p class="text-muted">Update food details and availability.</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn text-white mt-3"
                    style="background:#713541;">
                Save Changes
            </button>

            <a href="{% url 'manage_food' %}"
               class="btn btn-light mt-3">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
