
{% extends 'restaurant/base.html' %}

{% block title %}AI Assistant | Foodora{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto p-4" style="max-width: 650px;">

        <h3 class="text-center mb-2">Foodora AI Assistant</h3>
        <p class="text-center text-muted">Ask me anything about our menu!</p>

        <div id="chat-box" class="border rounded p-3 mb-3"
             style="height: 350px; overflow-y: auto;">
            <p><strong>Foodora AI:</strong> Hello! How can I help you today?</p>
        </div>

        <form id="chat-form">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" id="message"
                       class="form-control"
                       placeholder="Ask something..."
                       required>
                <button class="btn btn-dark" type="submit">Send</button>
            </div>
        </form>

    </div>
</div>

<script>

document.getElementById('chat-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const message = document.getElementById('message');
    const chatBox = document.getElementById('chat-box');
    const question = message.value.trim();

    if (!question) return;

    function addMessage(sender, text) {
        const p = document.createElement('p');
        const strong = document.createElement('strong');

        strong.textContent = sender + ': ';
        p.appendChild(strong);
        p.appendChild(document.createTextNode(text));

        chatBox.appendChild(p);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    addMessage('You', question);
    message.value = '';

    const loading = document.createElement('p');
    loading.textContent = 'Foodora AI is thinking...';
    chatBox.appendChild(loading);

    try {
        const response = await fetch("{% url 'ai_assistant' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: new URLSearchParams({message: question})
        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
            throw new Error(data.reply || 'Something went wrong.');
        }

        addMessage('Foodora AI', data.reply);

    } catch (error) {
        loading.remove();
        addMessage('Foodora AI', error.message || 'Please try again.');
    }
});

</script>
{% endblock %}
